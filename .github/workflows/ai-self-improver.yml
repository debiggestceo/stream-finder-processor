name: Stream Finder Maintenance Cycle

on:
  # GitHub may delay scheduled starts during platform load.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: stream-finder-maintenance-cycle
  cancel-in-progress: true

jobs:
  checks:
    name: Safe diagnostics and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Compile processor
        run: python -m py_compile app.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Check Cloudflare Worker syntax
        run: node --check worker/src/index.js

      - name: Write maintenance report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Stream Finder maintenance cycle"
            echo ""
            echo "- Result: **$JOB_STATUS**"
            echo "- Commit: `$COMMIT_SHA`"
            echo "- Run: $RUN_URL"
            echo "- Scope: Python compile, regression tests, Worker syntax."
            echo "- Production code and infrastructure are never modified by this workflow."
            echo "- AI-generated changes are disabled; no paid API is called."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update a failure report
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Stream Finder maintenance checks failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled 15-minute maintenance cycle detected a failing check.",
              "",
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
              "",
              "This workflow does not modify production. Inspect the failed step before making a fix."
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const issue = existing.data.find(item => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

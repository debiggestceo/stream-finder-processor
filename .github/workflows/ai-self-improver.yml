name: Stream Finder AI Self-Improver

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stream-finder-ai-self-improver
  cancel-in-progress: false

jobs:
  propose-improvement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install existing project dependencies
        run: pip install -r requirements.txt

      - name: Ask AI for one bounded improvement
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY repository secret is missing. Add it to enable AI proposals." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scripts/ai_self_improver.py

      - name: Run processor regression tests
        run: |
          python -m py_compile app.py
          python -m unittest discover -s tests -v
          node --check worker/src/index.js

      - name: Open or update a review-only pull request
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/ai-self-improver
          delete-branch: false
          title: "AI proposal: Stream Finder maintenance improvement"
          commit-message: "Propose bounded AI maintenance improvement"
          body: |
            ## Automated maintenance proposal

            This pull request was generated by the scheduled Stream Finder AI
            self-improver. It is restricted to application source and regression
            tests. CI must pass before any merge.

            - Production is not changed by this workflow.
            - Deployment and infrastructure files are outside the agent's allowlist.
            - No automatic merge is enabled.
          labels: |
            ai-proposal

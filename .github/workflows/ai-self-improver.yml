name: Stream Finder AI Self-Improver

on:
  # Frequent independent runs; GitHub may delay scheduled starts during load.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stream-finder-ai-self-improver
  # Never queue overlapping 15-minute runs; the newest check replaces an older one.
  cancel-in-progress: true

jobs:
  propose-improvement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether AI is explicitly enabled
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENABLE_AI_IMPROVER: ${{ vars.ENABLE_AI_IMPROVER }}
        run: |
          if [ "${ENABLE_AI_IMPROVER:-}" != "true" ]; then
            echo "::notice::AI calls are disabled to avoid OpenAI API charges. Free checks will continue every 15 minutes."
            echo "AI improvement calls are disabled. Set ENABLE_AI_IMPROVER=true only if you choose to pay for API usage." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::notice::OPENAI_API_KEY is missing; AI calls are skipped."
          fi

      - name: Install existing project dependencies
        run: pip install -r requirements.txt

      - name: Ask AI for one bounded improvement
        if: vars.ENABLE_AI_IMPROVER == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "AI step skipped because OPENAI_API_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python scripts/ai_self_improver.py

      - name: Run processor regression tests
        run: |
          python -m py_compile app.py
          python -m unittest discover -s tests -v
          node --check worker/src/index.js

      - name: Open or update a review-only pull request
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/ai-self-improver
          delete-branch: false
          title: "AI proposal: Stream Finder maintenance improvement"
          commit-message: "Propose bounded AI maintenance improvement"
          body: |
            ## Automated maintenance proposal

            This pull request is generated by the scheduled Stream Finder AI
            self-improver. It is restricted to application source and regression
            tests. CI must pass before any merge.

            - Production is not changed by this workflow.
            - Deployment and infrastructure files are outside the agent's allowlist.
            - No automatic merge is enabled.
            - Scheduled checks run every 15 minutes; GitHub may delay starts.

name: Stream Finder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: stream-finder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install processor dependencies
        run: pip install -r requirements.txt

      - name: Compile Python processor
        run: python -m py_compile app.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Check Cloudflare Worker syntax
        run: node --check worker/src/index.js

      - name: Verify required project files
        run: |
          test -s app.py
          test -s requirements.txt
          test -s worker/src/index.js
          test -s worker/wrangler.toml

  report-failure:
    if: failure() && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update diagnostic issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Stream Finder CI is failing";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The automated Stream Finder checks failed.",
              "",
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
              "",
              "Review the failed job logs, fix the underlying issue, and close this issue after a successful rerun."
            ].join("\\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const issue = existing.data.find(item => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: []
              });
            }

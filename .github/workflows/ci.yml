name: Stream Finder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-finder-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python processor
        run: python -m py_compile app.py

      - name: Check Cloudflare Worker syntax
        run: node --check worker/src/index.js

      - name: Verify required project files
        run: |
          test -s app.py
          test -s requirements.txt
          test -s worker/src/index.js
          test -s worker/wrangler.toml
